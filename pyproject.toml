[project]
name = "eidos"
version = "0.1.0a1"
description = "EIDOS — Entidad Cognitiva Autónoma, Profunda y Enjambre. Núcleo cognitivo neuro-simbólico portable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "EIDOS Project" },
]
keywords = ["ai", "cognitive-architecture", "neuro-symbolic", "multi-agent", "portable", "swarm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Fase 1.1 — Dependencias mínimas para el Core Engine + MonologueGenerator (stub)
dependencies = [
    "pydantic>=2.5.0,<3.0.0",        # Schemas del monólogo y futuras cápsulas
    "pyyaml>=6.0",                    # Config maestra (vibe-coding friendly)
    "structlog>=24.1.0",              # Logging estructurado
    "rich>=13.7.0",                   # CLI bonita para visualizar el monólogo
    "click>=8.1.0",                   # CLI framework
]

[project.optional-dependencies]
# Fase 2 — Cortex Hub (no se instalan todavía, documentación del upgrade path)
cortex = [
    "llama-cpp-python>=0.3.0",
    "sqlite-vec>=0.1.0",
]
# Fase 4 — EIDOS MESH
mesh = [
    "pyzmq>=25.0.0",
]
# Desarrollo
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
eidos = "eidos.cli:main"

[project.urls]
Homepage = "https://github.com/EIDOS-project/eidos"
Documentation = "https://github.com/EIDOS-project/eidos/tree/main/docs"
Repository = "https://github.com/EIDOS-project/eidos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eidos"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (lo manejamos con line-length)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert está bien en tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
