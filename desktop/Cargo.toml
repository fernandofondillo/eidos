[package]
name = "eidos-desktop"
version = "0.1.0"
description = "EIDOS — Entidad Cognitiva Autónoma, Profunda y Enjambre"
authors = ["EIDOS Project"]
license = "MIT"
repository = "https://github.com/fernandofondillo/eidos"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
